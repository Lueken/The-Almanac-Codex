<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="csv1 csd1" style="background: rgb(26, 20, 13);">
<title id="csv1">The Almanac Codex square logo</title>
<desc id="csd1">Square logo / thumbnail for ModDB. Three discovery-stage wax seals (Sighted, Held, Processed) on a leather-bound journal background.</desc>

<defs>
  <radialGradient id="sq_vignette" cx="50%" cy="50%" r="70%">
    <stop offset="0%" stop-color="#3d3024" stop-opacity="0"/>
    <stop offset="100%" stop-color="#1a140d" stop-opacity="1"/>
  </radialGradient>
  <pattern id="sq_leather" width="6" height="6" patternUnits="userSpaceOnUse">
    <rect width="6" height="6" fill="#3a2f22"/>
    <circle cx="1.5" cy="1.5" r="0.5" fill="#4a3d2c" opacity="0.5"/>
    <circle cx="4" cy="3" r="0.3" fill="#2a2118" opacity="0.7"/>
    <circle cx="2" cy="4.5" r="0.4" fill="#5a4a36" opacity="0.3"/>
  </pattern>
  <filter id="sq_seal_shadow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
    <feOffset dx="0" dy="2" result="offsetblur"/>
    <feFlood flood-color="#0a0805" flood-opacity="0.6"/>
    <feComposite in2="offsetblur" operator="in"/>
    <feMerge>
      <feMergeNode/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
</defs>

<rect width="512" height="512" fill="url(#sq_leather)"/>
<rect width="512" height="512" fill="url(#sq_vignette)" opacity="0.85"/>

<!-- inner frame -->
<rect x="16" y="16" width="480" height="480" fill="none" stroke="#5a4a36" stroke-width="1" opacity="0.6"/>
<rect x="24" y="24" width="464" height="464" fill="none" stroke="#5a4a36" stroke-width="0.5" opacity="0.4"/>

<!-- corner dots -->
<g opacity="0.5" fill="#d4a85a">
  <circle cx="36" cy="36" r="2.5"/>
  <circle cx="476" cy="36" r="2.5"/>
  <circle cx="36" cy="476" r="2.5"/>
  <circle cx="476" cy="476" r="2.5"/>
</g>

<!-- THE ALMANAC overline -->
<text x="256" y="74" font-family="Georgia, serif" font-size="13" fill="#8a7958" letter-spacing="6" text-anchor="middle">THE ALMANAC</text>

<!-- decorative divider with center dot -->
<g transform="translate(256, 100)">
  <line x1="-90" y1="0" x2="-15" y2="0" stroke="#5a4a36" stroke-width="0.5"/>
  <line x1="15" y1="0" x2="90" y2="0" stroke="#5a4a36" stroke-width="0.5"/>
  <circle cx="0" cy="0" r="2.5" fill="#d4a85a"/>
  <circle cx="-25" cy="0" r="1.2" fill="#5a4a36"/>
  <circle cx="25" cy="0" r="1.2" fill="#5a4a36"/>
</g>

<!-- big CODEX wordmark -->
<text x="256" y="190" font-family="Georgia, serif" font-size="76" font-weight="500" fill="#e8d9b8" letter-spacing="4" text-anchor="middle">CODEX</text>

<!-- italic subtitle -->
<text x="256" y="230" font-family="Georgia, serif" font-size="16" font-style="italic" fill="#a89776" letter-spacing="2" text-anchor="middle">progressive discovery</text>

<!-- three discovery-stage seals -->
<g transform="translate(256, 340)">

  <!-- SIGHTED (left) -->
  <g transform="translate(-95, 0)" filter="url(#sq_seal_shadow)">
    <circle cx="0" cy="0" r="40" fill="#3d2818" stroke="#d4a85a" stroke-width="2"/>
    <circle cx="0" cy="0" r="34" fill="none" stroke="#d4a85a" stroke-width="0.6"/>
    <circle cx="0" cy="0" r="28" fill="none" stroke="#d4a85a" stroke-width="0.3"/>
    <text x="0" y="-9" font-family="Georgia, serif" font-size="8" fill="#d4a85a" letter-spacing="1" text-anchor="middle">SIGHTED</text>
    <path d="M -8 4 L -2 10 L 10 -2" stroke="#d4a85a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- HELD (center) -->
  <g transform="translate(0, 0)" filter="url(#sq_seal_shadow)">
    <circle cx="0" cy="0" r="40" fill="#3d2818" stroke="#d4a85a" stroke-width="2"/>
    <circle cx="0" cy="0" r="34" fill="none" stroke="#d4a85a" stroke-width="0.6"/>
    <circle cx="0" cy="0" r="28" fill="none" stroke="#d4a85a" stroke-width="0.3"/>
    <text x="0" y="-9" font-family="Georgia, serif" font-size="8" fill="#d4a85a" letter-spacing="1" text-anchor="middle">HELD</text>
    <path d="M -8 4 L -2 10 L 10 -2" stroke="#d4a85a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- PROCESSED (right) — gold ring + label, no checkmark (stage not yet implemented in v0.2.x) -->
  <g transform="translate(95, 0)" filter="url(#sq_seal_shadow)">
    <circle cx="0" cy="0" r="40" fill="#3d2818" stroke="#d4a85a" stroke-width="2"/>
    <circle cx="0" cy="0" r="34" fill="none" stroke="#d4a85a" stroke-width="0.6"/>
    <circle cx="0" cy="0" r="28" fill="none" stroke="#d4a85a" stroke-width="0.3"/>
    <text x="0" y="-9" font-family="Georgia, serif" font-size="7" fill="#d4a85a" letter-spacing="0.8" text-anchor="middle">PROCESSED</text>
  </g>

  <!-- dashed connectors between seals -->
  <g stroke="#5a4a36" stroke-width="0.8" stroke-dasharray="3 4" fill="none">
    <line x1="-55" y1="0" x2="-40" y2="0"/>
    <line x1="40" y1="0" x2="55" y2="0"/>
  </g>
</g>

<!-- tagline -->
<text x="256" y="430" font-family="Georgia, serif" font-size="13" fill="#a89776" letter-spacing="0.5" text-anchor="middle">An almanac built up by observation.</text>

<!-- footer -->
<text x="256" y="465" font-family="Georgia, serif" font-size="9" fill="#6a5a42" letter-spacing="3" text-anchor="middle">v0.2.0 · BY LUEKEN</text>
</svg>
